const data=JSON.parse(document.getElementById('data').textContent),svg=document.querySelector('svg'),plot=document.getElementById('plot'),tip=document.getElementById('tip');
const W=1200,H=780,m={left:110,right:50,top:35,bottom:100},iw=W-m.left-m.right,ih=H-m.top-m.bottom;
const xmin=Math.min(-1,Math.floor(Math.min(...data.map(d=>d.x))-.35)),xmax=Math.max(1,Math.ceil(Math.max(...data.map(d=>d.x))+.35));
const ymin=Math.min(-1,Math.floor(Math.min(...data.map(d=>d.y))-.35)),ymax=Math.max(1,Math.ceil(Math.max(...data.map(d=>d.y))+.35));
const x=v=>m.left+(v-xmin)/(xmax-xmin)*iw,y=v=>m.top+ih-(v-ymin)/(ymax-ymin)*ih;
function el(n,a,t=''){const q=document.createElementNS('http://www.w3.org/2000/svg',n);Object.entries(a).forEach(([k,v])=>q.setAttribute(k,v));q.textContent=t;return q}
for(let t=xmin;t<=xmax;t++){plot.append(el('line',{x1:x(t),y1:m.top,x2:x(t),y2:m.top+ih,class:'grid'}));plot.append(el('text',{x:x(t),y:m.top+ih+28,'text-anchor':'middle',class:'tick'},t))}
for(let t=ymin;t<=ymax;t++){plot.append(el('line',{x1:m.left,y1:y(t),x2:m.left+iw,y2:y(t),class:'grid'}));plot.append(el('text',{x:m.left-18,y:y(t)+5,'text-anchor':'end',class:'tick'},t))}
plot.append(el('line',{x1:m.left,y1:m.top+ih,x2:m.left+iw,y2:m.top+ih,class:'axis'}));plot.append(el('line',{x1:m.left,y1:m.top,x2:m.left,y2:m.top+ih,class:'axis'}));
plot.append(el('line',{x1:x(0),y1:m.top,x2:x(0),y2:m.top+ih,class:'zero'}));plot.append(el('line',{x1:m.left,y1:y(0),x2:m.left+iw,y2:y(0),class:'zero'}));
plot.append(el('text',{x:m.left+iw/2,y:H-32,'text-anchor':'middle',class:'axis-label'},'Smart passes per 90 · standardized z-score'));

[...data].sort((a,b)=>Number(a.highlight)-Number(b.highlight)).forEach(d=>{const p=el('circle',{cx:x(d.x),cy:y(d.y),r:d.highlight?10:7,class:d.highlight?'highlight':'point'});p.addEventListener('mouseenter',()=>show(d,x(d.x),y(d.y)));p.addEventListener('mouseleave',()=>tip.classList.remove('visible'));plot.append(p)});
data.filter(d=>d.highlight).forEach(d=>{const [dx,dy]=offsets[d.name]||[14,-14];plot.append(el('text',{x:x(d.x)+dx,y:y(d.y)+dy,class:'label'},d.name))});
