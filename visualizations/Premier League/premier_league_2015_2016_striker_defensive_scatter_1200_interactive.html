  <script>
    const data = JSON.parse(document.getElementById("scatter-data").textContent);
    const svg = document.querySelector("svg");
    const plot = document.getElementById("plot");
    const tooltip = document.getElementById("tooltip");
    const width = 1200, height = 780;
    const margin = { left: 105, right: 50, top: 30, bottom: 100 };
    const innerW = width - margin.left - margin.right;
    const innerH = height - margin.top - margin.bottom;
    const minX = Math.floor(Math.min(...data.map(d => d.x)) - 0.5);
    const maxX = Math.ceil(Math.max(...data.map(d => d.x)) + 0.5);
    const minY = Math.floor(Math.min(...data.map(d => d.y)) - 0.5);
    const maxY = Math.ceil(Math.max(...data.map(d => d.y)) + 0.5);
    const x = value => margin.left + ((value - minX) / (maxX - minX)) * innerW;
    const y = value => margin.top + innerH - ((value - minY) / (maxY - minY)) * innerH;
    const make = (name, attrs, text = "") => {
      const el = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      if (text) el.textContent = text;
      return el;
    };
    for (let tick = minX; tick <= maxX; tick++) {
      plot.appendChild(make("line", { x1: x(tick), y1: margin.top, x2: x(tick), y2: margin.top + innerH, class: "grid" }));
      plot.appendChild(make("text", { x: x(tick), y: margin.top + innerH + 28, "text-anchor": "middle", class: "tick" }, tick));
    }
    for (let tick = minY; tick <= maxY; tick++) {
      plot.appendChild(make("line", { x1: margin.left, y1: y(tick), x2: margin.left + innerW, y2: y(tick), class: "grid" }));
      plot.appendChild(make("text", { x: margin.left - 18, y: y(tick) + 5, "text-anchor": "end", class: "tick" }, tick));
    }
    plot.appendChild(make("line", { x1: margin.left, y1: margin.top + innerH, x2: margin.left + innerW, y2: margin.top + innerH, class: "axis" }));
    plot.appendChild(make("line", { x1: margin.left, y1: margin.top, x2: margin.left, y2: margin.top + innerH, class: "axis" }));
    plot.appendChild(make("line", { x1: x(0), y1: margin.top, x2: x(0), y2: margin.top + innerH, class: "zero" }));
    plot.appendChild(make("line", { x1: margin.left, y1: y(0), x2: margin.left + innerW, y2: y(0), class: "zero" }));
    plot.appendChild(make("text", { x: margin.left + innerW / 2, y: height - 32, "text-anchor": "middle", class: "axis-label" }, "Pressing & Counterpressing Index"));
    plot.appendChild(make("text", { x: 24, y: margin.top + innerH / 2, transform: `rotate(-90 24 ${margin.top + innerH / 2})`, "text-anchor": "middle", class: "axis-label" }, "Defensive Intervention Index"));
    plot.appendChild(make("text", { x: x(maxX) - 12, y: y(maxY) + 28, "text-anchor": "end", class: "quadrant" }, "high press / high intervention"));
    plot.appendChild(make("text", { x: x(minX) + 12, y: y(maxY) + 28, "text-anchor": "start", class: "quadrant" }, "intervention-led"));
    plot.appendChild(make("text", { x: x(maxX) - 12, y: y(minY) - 14, "text-anchor": "end", class: "quadrant" }, "pressure-led"));
    plot.appendChild(make("circle", { cx: width - 285, cy: 18, r: 8, class: "point" }));
    plot.appendChild(make("text", { x: width - 268, y: 23, class: "legend" }, "Other 1200+ min strikers"));
    plot.appendChild(make("circle", { cx: width - 285, cy: 48, r: 10, class: "point-key" }));
    plot.appendChild(make("text", { x: width - 268, y: 53, class: "legend" }, "Highlighted players"));
    [...data].sort((a, b) => Number(a.is_key_player) - Number(b.is_key_player)).forEach(d => {
      const point = make("circle", { cx: x(d.x), cy: y(d.y), r: d.is_key_player ? 10 : 7, class: d.is_key_player ? "point-key" : "point" });
      point.addEventListener("mouseenter", () => showTooltip(d, x(d.x), y(d.y)));
      point.addEventListener("mouseleave", hideTooltip);
      plot.appendChild(point);
    });
    const labelOffsets = { "Kane": [15, -18], "Vardy": [-84, -18], "Agüero": [15, 32], "Lukaku": [15, 27], "Firmino": [15, -18], "Ayoze Pérez": [15, -18] };
    data.filter(d => d.is_key_player).forEach(d => {
      const [dx, dy] = labelOffsets[d.display_name] || [15, -18];
      plot.appendChild(make("text", { x: x(d.x) + dx, y: y(d.y) + dy, class: "label-key" }, d.display_name));
    });
    function showTooltip(d, cx, cy) {
      tooltip.innerHTML = `<strong>${d.display_name}</strong><br>${d.team_name} · ${d.minutes} mins<br>Pressing index: ${d.x} · rank ${d.pressing_rank}<br>Intervention index: ${d.y} · rank ${d.intervention_rank}<br>Pressure p90: ${d.pressure_per90} · Counterpress p90: ${d.counterpress_per90}<br>Ball recoveries p90: ${d.ball_recovery_per90} · Duels p90: ${d.duel_per90}`;
      const wrap = document.querySelector(".chart-wrap");
      const wrapRect = wrap.getBoundingClientRect();
      const svgRect = svg.getBoundingClientRect();
      const px = (cx / width) * svgRect.width;
      const py = (cy / height) * svgRect.height;
      tooltip.classList.add("visible");
      const box = tooltip.getBoundingClientRect();
      tooltip.style.left = `${Math.max(8, Math.min(px + 18, wrapRect.width - box.width - 8))}px`;
      tooltip.style.top = `${Math.max(8, Math.min(py - box.height - 12, wrapRect.height - box.height - 8))}px`;
    }
    function hideTooltip() { tooltip.classList.remove("visible"); }
  </script>
